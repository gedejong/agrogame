name: Benchmarks

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'agrogame/**'
      - 'tests/**'
      - 'scripts/**'
      # Client files Python tests read; this job collects the whole suite, so a
      # client-only PR must still run it (#573).
      - 'game/scripts/scenario_catalog.gd'   # tests/integration/test_pause_dynamics.py
      - 'game/scripts/fertilizer_picker.gd'  # tests/test_economy_phase_a.py
      - '.github/workflows/benchmarks.yml'

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: '1.7.1'

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-bench-${{ runner.os }}-py3.10-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-bench-${{ runner.os }}-py3.10-

      - name: Install deps
        run: poetry install --no-interaction

      - name: Run benchmark tests
        env:
          AGRO_BENCH: '1'
        run: |
          poetry run pytest -q -k benchmarks --no-cov
